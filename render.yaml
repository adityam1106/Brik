services:
  - type: web
    name: brik-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
